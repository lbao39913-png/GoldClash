name: build-goldclash on: workflow_dispatch: push: branches: [ main ] permissions: contents: write env: FLUTTER_VERSION: '3.47.4' GO_VERSION: '1.26.4' NDK_VERSION: r28c jobs: android: runs-on: ubuntu-latest steps: - name: Checkout FlClash uses: actions/checkout@v4 with: repository: chen08209/FlClash submodules: recursive path: src - name: Apply GoldClash patch run: | cat > /tmp/apply.sh <<'PATCH' #!/usr/bin/env bash # GoldClash: black-gold glass reskin of FlClash set -euxo pipefail cd "$1" # gold primary + app name sed -i 's/^const defaultPrimaryColor = ./const defaultPrimaryColor = 0xFFD4AF37;/' lib/common/constant.dart sed -i "s/^const appName = ./const appName = 'GoldClash';/" lib/common/constant.dart sed -i 's/^const defaultPrimaryColors = [/const defaultPrimaryColors = [\n  0xFFD4AF37,\n  0xFFB8860B,\n  0xFFE6C068,/' lib/common/constant.dart # dark + pure black by default sed -i 's/^const defaultThemeProps = ThemeProps(primaryColor: defaultPrimaryColor);/const defaultThemeProps = ThemeProps(primaryColor: defaultPrimaryColor, pureBlack: true, themeMode: ThemeMode.dark);/' lib/models/config.dart grep -q "pureBlack: true, themeMode" lib/models/config.dart # launcher label sed -i 's#<string name="app_name">FlClash</string>#<string name="app_name">GoldClash</string>#' android/common/src/main/res/values/strings.xml # glass cards / bars in dark theme python3 - <<'PY' import re p='lib/application.dart' s=open(p).read() old="""            colorScheme: _getAppColorScheme(brightness: Brightness.dark), ).withAppShapes,""" new="""            colorScheme: _getAppColorScheme(brightness: Brightness.dark), scaffoldBackgroundColor: const Color(0xFF000000), cardTheme: const CardThemeData( color: Color(0x1AFFFFFF), surfaceTintColor: Color(0x33D4AF37), elevation: 0, ), appBarTheme: const AppBarTheme( backgroundColor: Color(0xCC000000), foregroundColor: Color(0xFFD4AF37), surfaceTintColor: Color(0x00000000), elevation: 0, ), navigationBarTheme: const NavigationBarThemeData( backgroundColor: Color(0xE6101010), indicatorColor: Color(0x55D4AF37), ), dividerColor: const Color(0x33D4AF37), ).withAppShapes,""" assert old in s s=s.replace(old,new) open(p,'w').write(s) PY PATCH bash /tmp/apply.sh src - uses: actions/setup-go@v5 with: go-version: ${{ env.GO_VERSION }} cache-dependency-path: src/core/go.sum - uses: actions/setup-java@v4 with: distribution: temurin java-version: '17' - uses: gradle/actions/setup-gradle@v6 - uses: subosito/flutter-action@v2 with: channel: master flutter-version: ${{ env.FLUTTER_VERSION }} cache: true - name: Setup NDK uses: nttld/setup-ndk@v1 id: ndk with: ndk-version: ${{ env.NDK_VERSION }} add-to-path: true link-to-sdk: true - name: Build working-directory: src env: ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }} run: | flutter pub get dart setup.dart android --arch arm64 -v ls -la dist - name: Release uses: softprops/action-gh-release@v2 with: tag_name: build-${{ github.run_number }} name: GoldClash build ${{ github.run_number }} files: src/dist/*.apk
